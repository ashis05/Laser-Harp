<svg xmlns="http://www.w3.org/2000/svg" class="dia sch" viewBox="0 0 820 580" role="img" aria-label="Laser harp circuit: an Arduino Nano with six identical channels on A0 to A5. Each channel is a voltage divider, a photoresistor from +5V to the pin and a 240 ohm resistor from the pin to ground, with a laser module shining on the photoresistor."><style>
